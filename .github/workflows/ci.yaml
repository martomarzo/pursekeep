name: CI

on:
  push:
    # branches must be listed explicitly: with only tags-ignore, GitHub stops running on branch pushes
    branches: ["**"]
    tags-ignore: ["android-v*"]
    paths-ignore: ["android/**", ".github/workflows/android.yaml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yaml"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Production deploy: Render's GitHub auto-deploy stopped firing after the
  # 2026-09-22 repo rename, so CI triggers the service's Deploy Hook instead —
  # which also gates the deploy on lint/typecheck/tests/build passing.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set — skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
