name: CI

on:
  push:
    paths-ignore: ["android/**", ".github/workflows/android.yaml"]
  pull_request:
    paths-ignore: ["android/**", ".github/workflows/android.yaml"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
